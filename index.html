<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Boulder Herman - 100 Caves</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<h1>BOULDER HERMAN &mdash; 100 CAVES</h1>
<div id="hud">
  <span>CAVE <span id="h-level">1</span>/100</span>
  <span>DIAMONDS <span id="h-dia">0</span>/<span id="h-need">0</span></span>
  <span>TIME <span id="h-time">0</span></span>
  <span>SCORE <span id="h-score">0</span></span>
  <span>LIVES <span id="h-lives">0</span></span>
</div>
<div id="wrap">
  <canvas id="game" width="640" height="352"></canvas>
  <div id="overlay">
    <div id="ov-title">BOULDER HERMAN</div>
    <div id="ov-msg"></div>
    <div class="blink">PRESS SPACE</div>
  </div>
</div>
<div id="foot">MOVE: arrows / WASD &nbsp;|&nbsp; collect diamonds, then reach the exit door &nbsp;|&nbsp;
boulders crush things. Butterflies burst into diamonds. Fireflies just burst. &nbsp;|&nbsp; P pause, R restart cave</div>
<script src="src/engine.js"></script>
<script src="src/main.js"></script>
</body>
</html>
