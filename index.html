<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bouldering Herman and the Sloppy Rocks - 100 Caves</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="hud">
  <span>CAVE <span id="h-level">1</span>/100</span>
  <span>FLOWERS <span id="h-dia">0</span>/<span id="h-need">0</span></span>
  <span id="hud-keys" style="display:none">KEYS <span id="h-keys">0</span>/<span id="h-kneed">3</span></span>
  <span>TIME <span id="h-time">0</span></span>
  <span>SCORE <span id="h-score">0</span></span>
  <span>LIVES <span id="h-lives">0</span></span>
</div>
<div id="wrap">
  <canvas id="game" width="640" height="352"></canvas>
  <div id="frame"></div>
  <div id="overlay">
    <div id="ov-title">BOULDERING HERMAN AND THE SLOPPY ROCKS</div>
    <div id="ov-msg"></div>
    <div class="blink" id="ov-hint">PRESS SPACE</div>
  </div>
</div>
<script src="src/engine.js"></script>
<script src="src/aibot.js"></script>
<script src="src/main.js"></script>
</body>
</html>
